<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Sangeet - Dil Se Zuba Tak">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140e0b"/>
      <stop offset="1" stop-color="#2a1608"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="340" rx="24" fill="url(#bg)"/>
  <circle cx="830" cy="170" r="190" fill="url(#glow)">
    <animate attributeName="r" values="170;200;170" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Title -->
  <text x="48" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" fill="#fbeedd" letter-spacing="2">Sangeet</text>
  <text x="52" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#ff8a2a">dil se zuba tak</text>
  <rect x="52" y="162" width="0" height="3" rx="1.5" fill="#ff8a2a">
    <animate attributeName="width" values="0;220;220" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Equalizer bars -->
  <g fill="url(#bar)">
    <rect x="52"  y="290" width="12" height="20" rx="6"><animate attributeName="height" values="20;90;35;100;20" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="290;220;275;210;290" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="80"  y="290" width="12" height="20" rx="6"><animate attributeName="height" values="60;20;95;40;60" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="250;290;215;270;250" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="108" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="30;100;50;80;30" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="280;210;260;230;280" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="136" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="80;30;110;25;80" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="230;280;200;285;230" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="164" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="25;85;40;105;25" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="285;225;270;205;285" dur="1.0s" repeatCount="indefinite"/></rect>
    <rect x="192" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="70;110;30;60;70" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="240;200;280;250;240" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="220" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="40;20;90;50;40" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="270;290;220;260;270" dur="0.8s" repeatCount="indefinite"/></rect>
    <rect x="248" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="95;45;25;100;95" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="215;265;285;210;215" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="276" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="35;75;110;30;35" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="275;235;200;280;275" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="304" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="60;100;20;85;60" dur="1.35s" repeatCount="indefinite"/><animate attributeName="y" values="250;210;290;225;250" dur="1.35s" repeatCount="indefinite"/></rect>
    <rect x="332" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="20;60;105;45;20" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="290;250;205;265;290" dur="0.95s" repeatCount="indefinite"/></rect>
    <rect x="360" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="85;30;70;110;85" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="225;280;240;200;225" dur="1.25s" repeatCount="indefinite"/></rect>
    <rect x="388" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="45;95;25;65;45" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="265;215;285;245;265" dur="1.05s" repeatCount="indefinite"/></rect>
    <rect x="416" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="100;40;80;20;100" dur="1.45s" repeatCount="indefinite"/><animate attributeName="y" values="210;270;230;290;210" dur="1.45s" repeatCount="indefinite"/></rect>
    <rect x="444" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="30;80;50;105;30" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y" values="280;230;260;205;280" dur="0.85s" repeatCount="indefinite"/></rect>
    <rect x="472" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="70;25;100;55;70" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="240;285;210;255;240" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="500" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="50;105;35;90;50" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="260;205;275;220;260" dur="1.15s" repeatCount="indefinite"/></rect>
    <rect x="528" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="90;35;65;110;90" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="220;275;245;200;220" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="556" y="290" width="12" height="20" rx="6"><animate attributeName="height" values="25;70;100;40;25" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="285;240;210;270;285" dur="1.0s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Spinning vinyl -->
  <g transform="translate(830 170)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <circle r="112" fill="#0d0907" stroke="#ff8a2a" stroke-opacity="0.5" stroke-width="2"/>
      <circle r="96" fill="none" stroke="#2c1d14" stroke-width="2"/>
      <circle r="82" fill="none" stroke="#2c1d14" stroke-width="2"/>
      <circle r="68" fill="none" stroke="#2c1d14" stroke-width="2"/>
      <circle r="54" fill="none" stroke="#2c1d14" stroke-width="2"/>
      <path d="M -100 0 A 100 100 0 0 1 0 -100" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" stroke-linecap="round"/>
      <circle r="34" fill="#ff7a1a"/>
      <circle r="6" fill="#140e0b"/>
    </g>
    <!-- Tonearm -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 120 -110;3 120 -110;-4 120 -110" dur="5s" repeatCount="indefinite"/>
      <line x1="120" y1="-110" x2="30" y2="-30" stroke="#fbeedd" stroke-width="6" stroke-linecap="round"/>
      <circle cx="120" cy="-110" r="12" fill="#ff8a2a"/>
    </g>
  </g>

  <!-- Floating notes -->
  <g font-family="Georgia, serif" fill="#ffb347" font-size="34">
    <text x="640" y="120">♪<animate attributeName="y" values="140;70;140" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite"/></text>
    <text x="690" y="170" font-size="26">♫<animate attributeName="y" values="190;110;190" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></text>
    <text x="600" y="200" font-size="22">♩<animate attributeName="y" values="220;150;220" dur="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.7s" repeatCount="indefinite"/></text>
  </g>
</svg>
