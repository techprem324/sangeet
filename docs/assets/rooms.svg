<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Scrolling mood rooms">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140e0b"/><stop offset="1" stop-color="#25140a"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.08" stop-color="#fff"/>
      <stop offset="0.92" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1000" height="150" fill="url(#fade)"/></mask>
    <g id="row">
      <g><rect width="176" height="44" rx="22" fill="#2a1a10" stroke="#ff5c7a"/><circle cx="24" cy="22" r="6" fill="#ff5c7a"/><text x="42" y="27" fill="#fbeedd">Broken Heart</text></g>
      <g transform="translate(192 0)"><rect width="176" height="44" rx="22" fill="#2a1a10" stroke="#6aa9ff"/><circle cx="24" cy="22" r="6" fill="#6aa9ff"/><text x="42" y="27" fill="#fbeedd">Rainy Night</text></g>
      <g transform="translate(384 0)"><rect width="176" height="44" rx="22" fill="#2a1a10" stroke="#8be0a4"/><circle cx="24" cy="22" r="6" fill="#8be0a4"/><text x="42" y="27" fill="#fbeedd">Lo-Fi Focus</text></g>
      <g transform="translate(576 0)"><rect width="176" height="44" rx="22" fill="#2a1a10" stroke="#ff8a2a"/><circle cx="24" cy="22" r="6" fill="#ff8a2a"/><text x="42" y="27" fill="#fbeedd">Gym Beast</text></g>
      <g transform="translate(768 0)"><rect width="176" height="44" rx="22" fill="#2a1a10" stroke="#c79bff"/><circle cx="24" cy="22" r="6" fill="#c79bff"/><text x="42" y="27" fill="#fbeedd">Sufi Soul</text></g>
      <g transform="translate(960 0)"><rect width="196" height="44" rx="22" fill="#2a1a10" stroke="#ffd36a"/><circle cx="24" cy="22" r="6" fill="#ffd36a"/><text x="42" y="27" fill="#fbeedd">Bollywood Retro</text></g>
      <g transform="translate(1172 0)"><rect width="120" height="44" rx="22" fill="none" stroke="#8a7566" stroke-dasharray="4 4"/><text x="60" y="27" fill="#a58f7e" text-anchor="middle">+ 4 more</text></g>
    </g>
  </defs>
  <rect width="1000" height="150" rx="22" fill="url(#bg)"/>
  <g mask="url(#m)" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(0 20)">
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="-1308 0" dur="26s" repeatCount="indefinite"/>
        <use href="#row"/><use href="#row" x="1308"/><use href="#row" x="2616"/></g>
    </g>
    <g transform="translate(0 86)">
      <g><animateTransform attributeName="transform" type="translate" from="-654 0" to="-1962 0" dur="32s" repeatCount="indefinite"/>
        <use href="#row"/><use href="#row" x="1308"/><use href="#row" x="2616"/></g>
    </g>
  </g>
</svg>
